<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar</title>
</head>
<style>
*{
  margin: 0;
  padding: 0;
}
body{
  background-color:rgb(188, 195, 200);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 15px;
  height: 100vh;
}
 .container{
  width: 90%;
  padding: 6px;
  display: flex;
  background-color:rgb(197, 204, 207) ;
  justify-content: space-around;
  margin-top: 30px;
  margin-left: 70px;
  height: 60px;
  border: none;
  border-radius: 50px;
   box-shadow: 0 0 5px 2px rgba(0,0,0,0.2);

 }
.logo{
  display: flex;
  align-items: center;
  /* width: 200px; */
  margin-left: 30px;
 

}
.logo h1{
  font-size: 20px;
}
.list{
  display: flex;
  /* justify-content: center; */
  align-items: center;
  margin-left: 200px;
}
.list a {
  color: black;
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: bold;
  /* font-weight: 700; */
  padding-left: 10px;
}
.butt{
  display: flex;
  justify-content: flex-end;
  align-items: center;
}
button{
  background-color: black;
  color: white;
  font-weight: bold;
  padding-left: 25px;
  padding-right: 25px;
  padding-top: 11px;
  padding-bottom: 11px;
  margin-top: 10px;
  margin-bottom: 10px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
}
</style>
<body>
<div>

  <div class="container">  
    <div class="logo">
      <h1>Coil  Africa</h1>
     </div>
     
     <div class="list">
      <ul>
        <il><a href="#">About</a></il>
        <il><a href="#">Solution</a></il>
        <il><a href="#">Products</a></il>
        <il><a href="#">Team</a></il>
        <il><a href="#">FAQs</a></il>
        <il><a href="#">Contact</a></il>
        <il><a href="#">Get App</a></il>
      </ul>
     </div>
     <div class="butt">
      <button>Join Beta</button>
     </div>
  </div>
</body>
</html>
