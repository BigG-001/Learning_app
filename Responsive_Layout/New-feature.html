<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feature</title>
</head>
<body>
  <style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f6f8fb;
}

/* Navbar */

.navbar{
    width:100%;
    background:#fff;
    padding:15px 20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    position:fixed;
    top:0;
    left:0;
    z-index:1000;

    box-shadow:0 2px 15px rgba(0,0,0,.08);
}

/* Logo */

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo img{
    width:38px;
}

.logo span{
    font-size:20px;
    font-weight:700;
    color:#1b2340;
}

/* Menu Icon */

.menu-btn{
    width:45px;
    height:45px;
    background:#23253b;
    color:white;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:26px;
    cursor:pointer;

    transition:.4s;
}

.menu-btn:hover{
    background:#0e1326;
}

/* Dropdown */

.mobile-menu{
    position:absolute;
    top:80px;
    left:0;
    right:0;

    background: #bac6cd;

    border-radius:18px;

    box-shadow:0 15px 40px rgba(0,0,0,.15);

    overflow:hidden;

    max-height:0;

    transition:.45s ease;

    display:flex;
    flex-direction:column;
}

.mobile-menu.active{
    max-height:500px;
}

/* Links */

.mobile-menu a{
    text-decoration:none;
    color:#23253b;

    padding:18px 25px;

    font-size:17px;

    transition:.3s;
}

.mobile-menu a:hover{
    background:#23253b;
    color:white;
    padding-left:35px;
}

/* Button */

.join-btn{
    margin:20px;

    padding:15px;

    border:none;

    background:#23253b;
    color:white;

    border-radius:10px;

    font-size:16px;
    cursor:pointer;

    transition:.3s;
}

.join-btn:hover{
    background:#11162a;
}
  </style>
  <!--Adding new features-->
  <header class="navbar">
    <div class="logo">
        <img src="images/logo.png" alt="Coil Africa">
        <span>Coil Africa</span>
    </div>

    <div class="menu-btn" id="menuBtn">
        ☰
    </div>

    <nav class="mobile-menu" id="mobileMenu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">How It Works</a>
        <a href="#">Features</a>
        <a href="#">FAQs</a>
        <a href="#">Contact</a>

        <button class="join-btn">
            Join Waiting List
        </button>
    </nav>
</header>
  

<script>
  const menuBtn = document.getElementById("menuBtn");
const mobileMenu = document.getElementById("mobileMenu");

menuBtn.addEventListener("click", () => {
    mobileMenu.classList.toggle("active");

    if (mobileMenu.classList.contains("active")) {
        menuBtn.innerHTML = "✕";
    } else {
        menuBtn.innerHTML = "☰";
    }
});
