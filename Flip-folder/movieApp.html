    const searchInput  = document.getElementById("searchInput");
    const searchButton  = document.getElementById("searchButton");
    const moviesContainer  = document.getElementById("moviesContainer");
    const message  = document.getElementById("message");

    const API_KEY = "b18838e9&s";

    searchButton.addEventListener("click", () => {
     
        searchMovies()
     })
    //async and await are JavaScript keywords used to write asynchronous code (like fetching data from a server or reading a file) in a way that looks and behaves like clean, synchronous code.
     const url = "https://www.omdbapi.com/?i=tt3896198&apikey=b18838e9&s=Batman";
     async function searchMovies() {
             const input = searchInput.value.trim();

            if(input === ""){
              message.textContent = "Please enter a movie name";
              return;
            }
            
            message.textContent = "Searching ..."
      try{
            const response = await fetch(`https://www.omdbapi.com/?i=tt3896198&apikey=${API_KEY}&s=${input}&type=movie`); //template literal ``
            const data = await response.json();
            console.log(data);
                if(data.Response === "True"){
                  displayMovies(data.Search)
                }else{
                  message.textContent = "movie not found"
                }
      }catch(error){
             console.log(error);
             message.textContent = "Something went wrong"
      }finally{
        console.log("request finished");
      }
     }
     
    function displayMovies(movies) {

        moviesContainer.innerHTML = "";

        movies.forEach(function(movie) {

        const movieCard = `
            <div class="movie-card">

                <img src="${movie.Poster}" alt="${movie.Title}">

                <div class="movie-info">

                    <h2>${movie.Title}</h2>

                    <p>${movie.Year}</p>

                </div>

            </div>
        `;

        moviesContainer.innerHTML += movieCard;

    });
}
