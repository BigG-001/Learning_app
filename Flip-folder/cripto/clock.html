<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analog clock</title>
  <link rel="stylesheet" href="clock.css">
</head>
<body>
  <div class="container">
      <div class="clock">
        
          <div class="hand" id="hour" style="--clr: #c53131;"><i></i></div>
          <div class="hand" id="min" style="--clr: #4a58fd;"><i style="height: 80px;"></i></div>
          <div class="hand" id="sec" style="--clr: #ffff;"><i style="height: 90px;"></i></div>

          <span style="--i:1";><b>1</b></span>
          <span style="--i:2";><b>2</b></span>
          <span style="--i:3";><b>3</b></span>
          <span style="--i:4";><b>4</b></span>
          <span style="--i:5";><b>5</b></span>
          <span style="--i:6";><b>6</b></span>
          <span style="--i:7";><b>7</b></span>
          <span style="--i:8";><b>8</b></span>
          <span style="--i:9";><b>9</b></span>
          <span style="--i:10";><b>10</b></span>
          <span style="--i:11";><b>11</b></span>
          <span style="--i:12";><b>12</b></span>
      </div>
      <p class="par">Powered By BigG</p>
  </div>
  

  <script>
    let hour = document.getElementById("hour");
    let min = document.getElementById("min");
    let sec = document.getElementById("sec");

    function displayTime(){
      let date = new Date();

      // getting hours, minutes and seconds
      let hh = date.getHours();
      let mm = date.getMinutes();
      let ss = date.getSeconds();

      const hRotation = 30 * hh + mm/2;
      const mRotation = 6 * mm; 
      const sRotation = 6 * ss;

      hour.style.transform = `rotate(${hRotation}deg)`
      min.style.transform = `rotate(${mRotation}deg)`
      sec.style.transform = `rotate(${sRotation}deg)`
       }
    // setInterval is a js function that repeatedly runs a piece of code over a specific amount of time.
    setInterval(displayTime, 1000);
  </script>
</body>
</html>
