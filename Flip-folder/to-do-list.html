<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List</title>
</head>
<style>
  *{
    padding: 0;
    margin: 0;
    box-sizing: border-box;
  }
  body{
    display: flex;
    font-family: Arial, Helvetica, sans-serif;
    justify-content: center;
    align-items: center;
    justify-content: center;
    padding-top:50px ;
    background: #f2f2f2;
  }
  .todo-container {
    background: white;
    max-width: 100%;
    padding: 25px;
    border-radius: 10px;
  }
  h1{
    text-align: center;
  }
  .input-container {
      display: flex;
      gap: 10px;
  }

  #taskInput {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      outline: none;
  }


  #addBtn {
      padding: 10px 15px;
      cursor: pointer;
  }

  li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      margin-top: 10px;
      background: #eee;
  }

  .completed {
      text-decoration: line-through;
      opacity: 0.6;
  }
  .todo-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .delete-btn {
      background: red;
      color: white;
      border: none;
      padding: 5px 8px;
      cursor: pointer;
  }

</style>
<body>
    <div class="todo-container">
        <h1>My To Do List</h1>
        <div class="input-container">
            <input type="text" id="taskInput" placeholder="Enter Task">
            <button id="addBtn">Add</button>
            <ul id="taskList"></ul>
        </div>
    </div>

    <script>
        const taskInput = document.getElementById("taskInput");
        const addBtn = document.getElementById("addBtn");
        const taskList = document.getElementById("taskList");

        addBtn.addEventListener("click", addTask)

        function addTask(){
            const taskText = taskInput.value.trim();
            if(taskText === ""){
              return;
            }
            const li = document.createElement("li");
              li.innerHTML = `
              <div class="todo-left">
                <input type="checkbox">
               <span>${taskText}</span>
              </div>
            <button class ="delete-btn">Delete</button>
            `;
            taskList.appendChild(li);
           
            const deleteBtn = li.querySelector(".delete-btn");
            
            deleteBtn.addEventListener("click",  () => {
              li.remove();
            });
             taskInput.value = "";
        }
    </script>
</body>
</html>
