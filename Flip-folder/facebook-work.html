<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>form validation</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<style>
      *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }
    .container{
      display: flex;
      width: 80%;
      height: 100vh;
      box-sizing: border-box;
      justify-content: space-around;
      align-items: center;
      margin: auto;
    }
    h2{
      font-size: 3.5rem;
    }
    .item1{
      position: relative;
      background-color: #f5f5f5;
      box-shadow: 1px 1px 4px lightgray;
      border-radius: 8px;
      padding: 30px;
      width: 270px;
      height: 60vh;

    }
    form input{
      width: 100%;
      height: 40px;
      padding: 10px;
      border: 1px solid lightgray;
    } 
    #eye{
      position: absolute;
      top: 30%;
      transform: translateY(-30%);
      cursor: pointer;
      right: 40px;
      color: #888;
    }
    .gender-section{
      margin: 15px 0;
    }
    .gender-section p{
      font-weight: bold;
      margin-bottom: 10px;
    }
    .gender-options{
      display: flex;
      gap:15px;
    }
    .gender-option{
      display:flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s; 
    }
    .gender-option:hover{
      background-color:#f2f2f2
    }
    /* change style when input is selected 
    .gender-option:has(input:checked){
      background-color:#007bff;
      color: white;
      border-color:#007bff;
    }*/
    .checked{
      margin: 20px 0;
    }
    .checked label{
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: blue;
      text-decoration: underline;
      cursor: pointer;
    }
    .checked input{
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #007bff;
    }
    
    .login{
      width: 100%;
      background-color: rgb(80, 238, 49);
      color:white;
      border: none;
      padding: 10px;
      cursor: pointer;
    }
    #achor{
      text-align: center;
    }
    .item h2{
      color: blue;
    }
    
    
    @media(max-width: 768px){
      .container{
        flex-direction: column;
      }
      h2{
        text-align: center;
      }
    }
</style>
<body>
  <div class="container">
      <div class="item">
          <h2>chatbook</h2>
          <p>Chatbook help you connect and
            share with the people in your life</p>
      </div>
      <div class="item1">
          <form  id="formLogin">

                <input type="email" id="email" placeholder="Enter email address" ><br><br>
            
                <input type="password"  id="password" placeholder="password" > 
                    <i class="fa-solid fa-eye" id="eye"></i>                
                   
                  <div class="gender-section">
                      <p>Gender:</p>
                    <div class="gender-options">
                        <label class="gender-option">
                            <input type="radio" value="male" name="gender">
                            <span>Male</span>
                        </label>
                        <label class="gender-option">
                            <input type="radio" value="female" name="gender">
                            <span>Female</span>
                        </label>
                    </div>
                  </div>
                  <div class="checked">
                      <label>
                        <input type="checkbox" name="" id="terms">
                        <span>Agree to terms and condition</span>
                      </label>
                  </div>
                <button type="submit" class="login">Create Account</button><br>
                  <p id="message"></p><br>
                
          </form>
      </div>
  </div>

  <script>
    let formLogin = document.getElementById("formLogin");
    let email = document.getElementById("email");
    let password = document.getElementById("password");
    let message = document.getElementById("message");
    let eyeIcon = document.getElementById("eye");
    let terms = document.getElementById("terms");
    let gender = document.querySelector('input[name="gender"]:checked');
    

    message.style.color ="red";
    message.style.fontFamily = "italic"
    
    formLogin.addEventListener("submit", function(event) {
      event.preventDefault();

      let emailValue = email.value.trim(); // trim() removes spaces from the edges
      let passwordValue = password.value.trim();

      if(emailValue === "" || passwordValue === ""){
        message.textContent = "please fill in all field";
        return;
      }
      // email must include @ to be valid
      let emailpattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      
      // if(!emailValue.includes("@")){
      //   message.textContent = "Invalid email address";
      //   return;
      // }
      if(!emailpattern.test(emailValue)){
        message.textContent = "Please enter a email address.";
        return;
      }
      
      // Create a strong password 8 characters and above
      if(passwordValue.length < 8){
        message.textContent = "Please choose a more secure password. It should be longer than 6 characters";
        return;
      }
      // password validation
      if(!/[A-Z]/.test(passwordValue) && !/[0-9]/.test(passwordValue)){
        message.textContent = "Password must contain atleast 1 uppercase letter and 1 number";
        return;
      }
      let terms = document.getElementById("terms");
      let gender = document.querySelector('input[name="gender"]:checked');
        
      if(!gender){
        alert("Please select your gender");
        return;
      }
      if(!terms.checked){
        alert("You must agree to terms and condition before proceding");
        return;
      }
      alert("Account created successfully")
      
    })
    //   eyeIcon.addEventListener("click", () => {
    //   let type = password.getAttribute("type") === "password" ? "text" : "password";
    //   password.setAttribute("type", type);

    //   eyeIcon.classList.toggle("fa-eye-slash");
    //   eyeIcon.classList.toggle("fa-eye");
      
    // })
          // Toggle Password Visibility and Icon using Ternary Operators
      eyeIcon.addEventListener("click", () => {
        const isPassword = password.getAttribute("type") === "password";

        // Toggle input type: if password -> text, else -> password
        password.setAttribute("type", isPassword ? "text" : "password");

        // Toggle icon class: if password -> add slash, else -> remove slash
        eyeIcon.classList.toggle("fa-eye-slash", isPassword);
        eyeIcon.classList.toggle("fa-eye", !isPassword);
      });
  </script>
</body>
</html>
