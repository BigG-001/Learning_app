<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>form validation</title>
</head>
<style>
      *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }
    .container{
      display: flex;
      width: 80%;
      height: 100vh;
      box-sizing: border-box;
      justify-content: space-around;
      align-items: center;
      margin: auto;
    }
    .item1{
      background-color: #f5f5f5;
      box-shadow: 1px 1px 4px lightgray;
      border-radius: 8px;
      padding: 30px;
      width: 270px;
      height: 40vh;

    }
    form input{
      width: 100%;
      height: 40px;
      padding: 10px;
      border: 1px solid lightgray;
    } 
    .login{
      width: 100%;
      background-color: rgb(134, 134, 239);
      color:white;
      border: none;
      padding: 10px;
      cursor: pointer;
    }
    #achor{
      text-align: center;
    }
    .item h2{
      color: blue;
    }
    
    
    @media(max-width: 768px){
      .container{
        flex-direction: column;
      }
    }
</style>
<body>
  <div class="container">
      <div class="item">
          <h2>facebook</h2>
          <p>Facebook help you connect and
            share with the people in your life</p>
      </div>
      <div class="item1">
          <form  id="formLogin">

                <input type="email" id="email" placeholder="Enter email address" ><br><br>
            
                <input type="password"  id="password" placeholder="password" > <br><br>
                
                <button type="submit" class="login">log in</button><br>
                  <p id="message"></p><br>
                
          </form>
      </div>
  </div>

  <script>
    let formLogin = document.getElementById("formLogin");
    let email = document.getElementById("email");
    let password = document.getElementById("password");
    let message = document.getElementById("message");

    message.style.color ="gray";
    message.style.fontFamily = "italic"
    
    formLogin.addEventListener("submit", function(event) {
      event.preventDefault();

      let emailValue = email.value.trim();
      let passwordValue = password.value.trim();

      if(emailValue === "" || passwordValue === ""){
        message.textContent = "please fill in all field";
        return;
      }
      if(!emailValue.includes("@")){
        message.textContent = "Invalid email address";
        return;
      }
      if(passwordValue.length < 8){
        message.textContent = "Password must me atleast 8 characters";
        return;
      }
      // password validation
      if(!/[A-Z]/.test(passwordValue) && !/[0-9]/.test(passwordValue)){
        message.textContent = "Password must contain atleast 1 uppercase letter and 1 number";
        return;
      }
      message.textContent = "Form submitted successfully";
    })
  </script>
</body>
</html>
