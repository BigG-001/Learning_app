<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Basics</title>
</head>
<body>
  <div class="js-container"></div>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
      
      <script type="text/babel">
    const button = React.createElement('button', null, 'Submit');
    const paragraph = React.createElement('p', null, 'Proceed to the next page');
    const div =React.createElement('div', null, button, paragraph); 
      

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(div);
    </script>
</body>
</html>
