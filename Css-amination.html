<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=
  , initial-scale=1.0">
  <title>Css Anamination</title>
  <style>
    .container{
      display: flex;
      width: 100%;
      height: 200px;
      align-items: center;
      justify-content: center;
    }

    button{
      
      background: blue;
      color: white;
      /* transition: background 0.8s, border 0.9s, transform 0.5s ; */
      transition: all 1s ease-in-out;
            /*transition: property duration*/
    }
    button:hover{
      background: red;
      border: 1px solid lime;
      transform: scale(1.5);
    }
    .box{
      background: blue;
      width: 100px;
      height: 100px;
      animation: spin 1s linear infinite ;
      transition: transform 1s ease, background-color 1s ease;
    }
    .box:hover{
      transform: translatex(300px)
      rotate( 180deg);
      background-color: red;
    }
    /* .loader{
      animation: spin 1s linear infinite ;
    } */
    

    /*Spining animation*/
    @keyframes spin{
      from{
        transform: rotate(0deg);
      }
      to{
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <p></p>
  <button>Hover me</button>

  <div class="box">

  </div>
  </div>
  
</body>
</html>
