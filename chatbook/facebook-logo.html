<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook logo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
    .container{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      position: relative;
      font-family: "Roboto";
    }
    .logo{
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: #0866FF;
      display: flex;
      align-items: center;
      justify-content: center;

    }
    .logo span{
      position: absolute;
      font-size: 4.5rem;
      font-weight: 700;
      color: #ffffff;
      top: 299px;
      

    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Creating a facebook logo</h1>
    <div class="logo"><span>f</span></div>
  </div>
</body>
</html>
