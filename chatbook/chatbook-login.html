<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>login Form</title>
  <link rel="stylesheet" href="chatbook-login.css">
</head>
<body>
  <div class="container">
      <div class="grand-parent">
          <div class="logo"><span>C</span></div>
          <h2 class="hatbook">hatbook</h2>
          <div class="parent">
              <div class="son">
                  <h2>Explore the things <span>you love</span>.</h2>
              </div>
              <div class="daughter">
                  <img src="chatbook-pic1 (1).png" alt="loading">
              </div>
          </div>
      </div>
      <div class="grand-parent">
          <div class="form-container">
            <form action="" id="signUp">
                <p class="log">Log in to Chatbook</p>
                <input type="email, number" name="" id="email" placeholder="Email address or mobile number">
                <input type="password" name="" id="password" placeholder="Password">
                <button class="login-btn">Log in</button>
                <p class="forgot-pass"><a href="">Forgotten password?</a></p>

                <p class="create-account"><a href="">Create new account</a></p>
                
            </form>
          </div>
      </div>
  </div>
</body>
</html>
